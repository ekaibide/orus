# Publica la carpeta web/ en GitHub Pages en cada push a main que la toque.
name: Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Versionar los scripts y la hoja de estilos (GitHub Pages cachea 10 min)
        env:
          V: ${{ github.sha }}
        run: |
          sed -i -E "s#\"\./(app\.js|styles\.css)\"#\"./\1?v=${V:0:8}\"#g" web/index.html
          sed -i -E "s#\"\./(config\.js|vendor/libs\.js|vendor/ffmpeg/index\.js)\"#\"./\1?v=${V:0:8}\"#g" web/app.js
          grep -o 'app.js?v=[a-f0-9]*' web/index.html
          grep -o 'styles.css?v=[a-f0-9]*' web/index.html
          grep -o '[a-z/]*\.js?v=[a-f0-9]*' web/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
